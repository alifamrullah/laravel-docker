services:
  # 1. Service Aplikasi (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www # Mount kodingan agar ada efek Live-Reload
    networks:
      - laravel_network

  # 2. Service Web (Nginx)
  web:
    image: nginx:alpine
    container_name: laravel_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf # File konfigurasi nginx
    networks:
      - laravel_network
    depends_on:
      - app

  # 3. Service Database (MySQL)
  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      # Variabel ini akan otomatis diisi dengan data di file .env Laravel kamu nantinya
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql # Mengamankan data database layaknya docker volume
    networks:
      - laravel_network
    ports:
      - "3306:3306"

networks:
  laravel_network:
    driver: bridge

volumes:
  dbdata: